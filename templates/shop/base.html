<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}ぽちっとストア</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="shop">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ url_for('index') }}">
        <span class="logo-dot"></span>ぽちっとストア
      </a>
      <nav>
        <a href="{{ url_for('cart') }}" class="cart-link">カート<span class="badge">{{ cart_count }}</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">ぽちっとストア ／ IT勉強会用のサンプルECサイトです。実際の販売・決済は行いません。</div>
  </footer>
</body>
</html>
